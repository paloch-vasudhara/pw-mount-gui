# MediaMTX config template for the mount camera (T5.7): RTSP in -> HLS out.
#
# Copy to mediamtx.yml next to the mediamtx binary and replace the placeholder below.
# The camera login goes inside the RTSP source URL; keep that copy out of git and readable
# only by the account that runs the relay.
#
# Result: http://127.0.0.1:8888/mount/index.m3u8  <- put THIS in Station Settings > CCTV
# (type HLS). The gateway proxies it; the browser never talks to MediaMTX or the camera.

logLevel: warn

# Only the HLS output is used. Everything else is off, and HLS listens on loopback only.
rtsp: no
rtmp: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes # keep the playlist warm so the first viewer does not wait
hlsVariant: mpegts # widest hls.js / native support; lowLatency only if the delay matters
hlsSegmentCount: 6
hlsSegmentDuration: 2s

paths:
  mount:
    # The camera's RTSP URL, e.g. rtsp://user:password@192.168.1.64:554/Streaming/Channels/101
    source: rtsp://KuPlanewaveL350:delvaero1234@192.168.80.72:554/PATH
    sourceOnDemand: no # always pulling: a viewer sees the picture at once
    rtspTransport: tcp # TCP is the reliable choice over a LAN / Wi-Fi bridge
